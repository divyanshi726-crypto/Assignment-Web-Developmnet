
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Styled Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #243047;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 30px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0001;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #dbeafe;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning HTML and CSS</p>
    </header>

    <main>
        <h2>About My Website</h2>
        <p>
            HTML creates the structure of a webpage,
            while CSS makes it attractive.
        </p>

        <h3>What I Am Learning</h3>
        <ul>
            <li>HTML Basics</li>
            <li>CSS Styling</li>
            <li>Box Model</li>
        </ul>
    </main>

    <footer>
        <p>Created by Student | 2026</p>
    </footer>

</body>
</html>
