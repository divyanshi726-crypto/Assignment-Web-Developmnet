
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #dce8f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgb(231, 228, 228);
            width: 300px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px #424344;
        }

        h2 {
            text-align: center;
            color: #34373a;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #365777;
        }

        #message {
            text-align: center;
            color: #243b55;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form onsubmit="loginUser(event)">
        <label>Email</label>
        <input type="email" required placeholder="Enter your email">

        <label>Password</label>
        <input type="password" required minlength="6"
               placeholder="Enter password">

        <button type="submit">Login</button>
    </form>

    <p id="message"></p>
</div>

<script>
    function loginUser(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
            "Demo login form submitted successfully!";
    }
</script>

</body>
</html>
