
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 23 - Utility Functions</title>
</head>
<body>
    <h2>Settings and Shopping Cart</h2>
    <p id="settings"></p>
    <p id="total"></p>

    <script>
        // Merge default settings with custom settings
        function mergeSettings(defaults, custom) {
            return { ...defaults, ...custom };
        }

        // Calculate total shopping cart price
        function cartTotal(items) {
            return items.reduce(function(sum, item) {
                if (item.price < 0 || item.quantity < 0) {
                    throw new Error("Invalid price or quantity");
                }

                return sum + item.price * item.quantity;
            }, 0);
        }

        const defaults = {
            theme: "light",
            language: "English"
        };

        const custom = {
            theme: "dark"
        };

        const settings = mergeSettings(defaults, custom);

        document.getElementById("settings").textContent =
            "Merged Settings: " + JSON.stringify(settings);

        const items = [
            { price: 100, quantity: 2 },
            { price: 50, quantity: 1 }
        ];

        document.getElementById("total").textContent =
            "Cart Total: ₹" + cartTotal(items);
    </script>
</body>
</html>
