
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d8b4fe, #fbcfe8, #c4b5fd);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(90, 50, 120, 0.18);
    }

    .icon {
      width: 65px;
      height: 65px;
      background: #f3e8ff;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      color: #6b21a8;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #444;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      font-family: Arial, sans-serif;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px #f3e8ff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #9333ea, #db2777);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px #d8b4fe;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      color: #166534;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    #result h3 {
      margin-top: 0;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="icon">💌</div>

    <h1>Contact Us</h1>
    <p class="subtitle">We would love to hear from you!</p>

    <form id="contactForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="message">Your Message</label>
      <textarea
        id="message"
        placeholder="Write your message here..."
        required
      ></textarea>

      <button type="submit">Send Message ✨</button>
    </form>

    <div id="result" aria-live="polite"></div>

    <footer>Made with ❤️ using HTML, CSS & JavaScript</footer>

  </div>

  <script>
    const form = document.getElementById("contactForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !message) {
        result.style.display = "block";
        result.style.background = "#fef2f2";
        result.style.color = "#b91c1c";
        result.textContent = "Please fill in all fields.";
        return;
      }

      result.style.display = "block";
      result.style.background = "#f0fdf4";
      result.style.color = "#166534";

      const heading = document.createElement("h3");
      heading.textContent = "✅ Message Submitted!";

      const nameText = document.createElement("p");
      nameText.textContent = "Name: " + name;

      const emailText = document.createElement("p");
      emailText.textContent = "Email: " + email;

      const messageText = document.createElement("p");
      messageText.textContent = "Message: " + message;

      result.replaceChildren(
        heading,
        nameText,
        emailText,
        messageText
      );
    });
  </script>
</body>
</html>
