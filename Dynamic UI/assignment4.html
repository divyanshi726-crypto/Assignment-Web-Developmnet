
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d8b4fe, #fbcfe8, #c4b5fd);
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 28px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(91, 33, 120, 0.18);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .icon {
      font-size: 42px;
    }

    h1 {
      color: #7e22ce;
      margin: 10px 0;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
    }

    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input, select, button {
      font: inherit;
    }

    #taskInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      outline: none;
    }

    #taskInput:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px #f3e8ff;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.96);
    }

    .add-btn {
      color: white;
      background: linear-gradient(90deg, #9333ea, #db2777);
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .stat {
      padding: 13px 5px;
      background: #f5f3ff;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: #7e22ce;
      margin-bottom: 5px;
    }

    .stat span {
      color: #777;
      font-size: 12px;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
    }

    .filter-row label {
      color: #555;
      font-weight: bold;
    }

    #filter {
      padding: 9px;
      border: 1px solid #ddd6fe;
      border-radius: 9px;
      background: white;
      max-width: 55%;
    }

    #taskList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #eee5ff;
      border-radius: 12px;
      background: #fdfbff;
    }

    .task-check {
      width: 18px;
      height: 18px;
      accent-color: #9333ea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: #444;
    }

    .task-text.completed {
      text-decoration: line-through;
      color: #999;
    }

    .task-actions {
      display: flex;
      gap: 5px;
    }

    .edit-btn {
      background: #ede9fe;
      color: #6d28d9;
    }

    .delete-btn {
      background: #ffe4e6;
      color: #be123c;
    }

    #emptyMessage {
      text-align: center;
      padding: 25px 5px;
      color: #999;
    }

    #notice {
      min-height: 20px;
      color: #7e22ce;
      font-size: 14px;
      margin-top: 14px;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 25px;
    }

    @media (max-width: 420px) {
      .container {
        padding: 19px;
      }

      .task-item {
        flex-wrap: wrap;
      }

      .task-actions {
        margin-left: 27px;
      }

      .task-form {
        gap: 6px;
      }

      .add-btn {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="icon">📝</div>
      <h1>My To-Do List</h1>
      <p class="subtitle">Plan your day, one task at a time ✨</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        id="taskInput"
        type="text"
        placeholder="What do you need to do?"
        aria-label="New task"
        required
      >
      <button class="add-btn" type="submit">+ Add</button>
    </form>

    <section class="stats" aria-label="Task summary">
      <div class="stat">
        <strong id="totalCount">0</strong>
        <span>Total Tasks</span>
      </div>
      <div class="stat">
        <strong id="doneCount">0</strong>
        <span>Completed</span>
      </div>
      <div class="stat">
        <strong id="leftCount">0</strong>
        <span>Remaining</span>
      </div>
    </section>

    <div class="filter-row">
      <label for="filter">My Tasks</label>
      <select id="filter">
        <option value="all">All Tasks</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage">🌸 No tasks yet. Add your first task!</p>
    <p id="notice" aria-live="polite"></p>

    <footer>Made with ❤️ using HTML, CSS & JavaScript</footer>
  </main>

  <script>
    const tasks = [];
    let nextId = 1;

    const form = document.querySelector("#taskForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");
    const filter = document.querySelector("#filter");
    const emptyMessage = document.querySelector("#emptyMessage");
    const notice = document.querySelector("#notice");

    function updateStats() {
      const completed = tasks.filter(task => task.done).length;

      document.querySelector("#totalCount").textContent = tasks.length;
      document.querySelector("#doneCount").textContent = completed;
      document.querySelector("#leftCount").textContent =
        tasks.length - completed;
    }

    function renderTasks() {
      list.replaceChildren();

      const visibleTasks = tasks.filter(task => {
        if (filter.value === "active") return !task.done;
        if (filter.value === "completed") return task.done;
        return true;
      });

      emptyMessage.style.display =
        visibleTasks.length === 0 ? "block" : "none";

      if (visibleTasks.length === 0) {
        emptyMessage.textContent = tasks.length === 0
          ? "🌸 No tasks yet. Add your first task!"
          : "🌷 No tasks in this category.";
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = "task-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Complete " + task.text);

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          notice.textContent = task.done
            ? "Great job! Task completed 🎉"
            : "Task marked as active.";
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        if (task.done) {
          text.classList.add("completed");
        }

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "edit-btn";
        editBtn.type = "button";
        editBtn.textContent = "✏️ Edit";
        editBtn.setAttribute("aria-label", "Edit " + task.text);

        editBtn.addEventListener("click", () => {
          const updatedText = prompt("Edit your task:", task.text);

          if (updatedText === null) return;

          if (!updatedText.trim()) {
            notice.textContent = "Task cannot be empty.";
            return;
          }

          task.text = updatedText.trim();
          notice.textContent = "Task updated successfully!";
          renderTasks();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.type = "button";
        deleteBtn.textContent = "🗑 Delete";
        deleteBtn.setAttribute("aria-label", "Delete " + task.text);

        deleteBtn.addEventListener("click", () => {
          const index = tasks.findIndex(item => item.id === task.id);

          if (index !== -1) {
            tasks.splice(index, 1);
          }

          notice.textContent = "Task deleted.";
          renderTasks();
        });

        actions.append(editBtn, deleteBtn);
        item.append(checkbox, text, actions);
        list.append(item);
      });

      updateStats();
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const taskText = input.value.trim();

      if (!taskText) {
        notice.textContent = "Please enter a task.";
        return;
      }

      tasks.push({
        id: nextId++,
        text: taskText,
        done: false
      });

      input.value = "";
      notice.textContent = "Task added successfully! ";

      renderTasks();
      input.focus();
    });

    filter.addEventListener("change", renderTasks);

    renderTasks();
  </script>
</body>
</html>
