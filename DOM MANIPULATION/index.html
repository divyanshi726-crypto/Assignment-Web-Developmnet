
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Updater</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f0ff;
      padding: 30px;
    }
    .profile {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 12px #ccc;
    }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 8px 0;
    }
    button {
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="profile">
    <h2 id="profileName">Guest</h2>
    <p id="bio">No bio yet</p>

    <input id="nameInput" placeholder="Enter your name">
    <textarea id="bioInput" placeholder="Write your bio"></textarea>
    <button id="updateBtn">Update Profile</button>
  </div>

  <script>
    document.querySelector("#updateBtn").addEventListener("click", () => {
      const name = document.querySelector("#nameInput").value.trim();
      const bio = document.querySelector("#bioInput").value.trim();

      document.querySelector("#profileName").textContent = name || "Guest";
      document.querySelector("#bio").textContent = bio || "No bio yet";
    });
  </script>
</body>
</html>
